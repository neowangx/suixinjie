name: Windows build and checks

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify
        shell: pwsh
        run: |
          dotnet build windows/Verify/Suixinjie.Verify.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & windows/Verify/bin/Release/net48/Suixinjie.Verify.exe
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Suixinjie-Windows-unsigned
          path: |
            windows/bin/Release/net48/Suixinjie.exe
            windows/bin/Release/net48/Suixinjie.exe.config
          if-no-files-found: error
